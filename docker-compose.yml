version: "3.9"

services:
  # Redis for local development (use Upstash in production)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Worker for scraping jobs
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    command: npm run worker
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development

volumes:
  redis_data:
